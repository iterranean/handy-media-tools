name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Package release artifact
        run: |
          tar czf "handy-media-tools-${GITHUB_REF_NAME}.tar.gz" bin README.md
          sha256sum "handy-media-tools-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: 'handy-media-tools-${{ github.ref_name }}.tar.gz'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            handy-media-tools-${{ github.ref_name }}.tar.gz
            SHA256SUMS
